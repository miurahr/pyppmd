[project]
name = "pyppmd"
requires-python = ">=3.10"
description = "PPMd compression/decompression library"
readme = "README.rst"
license = {text = "LGPL-2.1-or-later"}
authors = [
    {name = "Hiroshi Miura", email = "miurahr@linux.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
      "pytest>=6.0,<9.2.0",
      "pytest-benchmark",
      "pytest-cov",
      "pytest-timeout",
      "hypothesis",
      "coverage[toml]>=5.2",
]
check = [
    "mypy>=1.10.0",
    "check-manifest",
    "ruff",
    "readme-renderer",
    "pygments"
]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
]
fuzzer = [
    "atheris",
    "hypothesis",
]

[project.urls]
Source = "https://github.com/miurahr/pyppmd"
Homepage = "https://pyppmd.readthedocs.io/"
Documentation = "https://pyppmd.readthedocs.io/en/stable/"
"Bug Tracker" = "https://github.com/miurahr/pyppmd/issues"
Changelog = "https://pyppmd.readthedocs.io/en/latest/changelog.html"

[build-system]
requires = ["setuptools>=59", "setuptools_scm[toml]>=6.4.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.setuptools.package-data]
pyppmd = ["py.typed"]

[tool.ruff]
line-length = 125
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E203", "F841"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.paths]
source = ["src", "**/site-packages"]

[tool.coverage.run]
branch = true
parallel = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["if __name__ == .__main__.:", "pragma: no-cover", "@abstract", "def __repr__"]
ignore_errors = true

[tool.mypy]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
strict_optional = true
show_column_numbers = true
files = "*.py"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = "test*.py"
norecursedirs = [".git", "_build", "tmp", ".eggs"]

[tool.cibuildwheel]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-i686-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
manylinux-ppc64le-image = "manylinux_2_28"
manylinux-s390x-image = "manylinux_2_28"
manylinux-pypy_x86_64-image = "manylinux_2_28"
manylinux-pypy_aarch64-image = "manylinux_2_28"

musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"
musllinux-ppc64le-image = "musllinux_1_2"
musllinux-s390x-image = "musllinux_1_2"

[tool.cibuildwheel.linux]
archs = ["auto64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "universal2", "arm64"]

[tool.tox]
requires = ["tox>=4.19"]
envlist = [
    "check",
    "pypy-3.11",
    "3.10",
    "3.11",
    "3.12",
    "3.13",
    "3.14",
    "3.15",
    "docs",
]
isolated_build = true

[tool.tox.env_run_base]
description = "Run test under {base_python}"
passenv = [
    "GITHUB_*",
    "PYTEST_ADDOPTS",
    "SETUPTOOLS_USE_DISTUTILS"
]
extras = ["test"]
commands = [["python", "-m", "pytest", "-vv", "-s"]]

[tool.tox.env.check]
extras = ["check"]
ignore_errors = true
commands = [["check-manifest", "{toxinidir}"], ["ruff", "check", "src", "tests"]]

[tool.tox.env.docs]
extras = ["docs"]
commands = [
    ["sphinx-build", "{posargs:-E}", "-b", "html", "docs", "build/docs"],
    ["sphinx-build", "-b", "linkcheck", "docs", "build/docs"]
]
